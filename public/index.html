<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
    <p class="subtitle">Click any photo to view and download in your preferred resolution.</p>
  </header>

  <main>
    <div id="gallery" class="gallery" role="list" aria-label="Photo gallery">
      <p class="loading">Loading photos…</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" />
      <div class="lightbox-info">
        <p id="lightbox-title" class="lightbox-filename"></p>
        <div class="download-section">
          <h2>Download</h2>
          <p class="download-hint">Choose a resolution to download this photo as a desktop background.</p>
          <div class="download-buttons" id="download-buttons"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/gallery.js"></script>
</body>
</html>
